version: '3.8'

services:
  fastapi-backend:
    build: .
    container_name: resume-analyzer-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  streamlit-frontend:
    build: .
    container_name: resume-analyzer-ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - fastapi-backend
    environment:
      - API_URL=http://resume-analyzer-api:8000/api/analyze
